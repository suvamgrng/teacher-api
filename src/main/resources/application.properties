spring.application.name=teacher-api
spring.datasource.url=${TEACHER_DB_URL:jdbc:postgresql://localhost:5432/teacher_db}
spring.datasource.username=${TEACHER_DB_USERNAME:postgres}
spring.datasource.password=${TEACHER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}